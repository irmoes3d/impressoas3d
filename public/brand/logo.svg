<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0b1b36" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#070c18" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="1"/>
    </radialGradient>

    <!-- Chrome Gradients -->
    <linearGradient id="chromeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#d4dbe6"/>
      <stop offset="50%" stop-color="#8a97aa"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="chromeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Electric Cyan Blue Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="30%" stop-color="#00d2ff"/>
      <stop offset="70%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#003db3"/>
    </linearGradient>

    <linearGradient id="neonCyanLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="1000" fill="url(#bgGlow)"/>

  <!-- Ambient Glow in Center -->
  <circle cx="500" cy="400" r="280" fill="#00d2ff" opacity="0.12" filter="url(#cyanGlow)"/>

  <!-- ================= MONOGRAM EMBLEM (DT) ================= -->
  <g transform="translate(500, 390)" filter="url(#dropShadow)">
    
    <!-- Outer Hex Shield Glow Outline -->
    <polygon points="0,-270 230,-135 230,135 0,270 -230,135 -230,-135" 
             fill="#050d1a" stroke="url(#neonCyan)" stroke-width="6" opacity="0.8" filter="url(#cyanGlow)"/>
    <polygon points="0,-255 215,-127 215,127 0,255 -215,127 -215,-127" 
             fill="#081020" stroke="#1e293b" stroke-width="3"/>

    <!-- Subtle Tech Grid Lines inside Hexagon -->
    <path d="M-215,-127 L215,127 M-215,127 L215,-127 M0,-255 L0,255" stroke="#00d2ff" stroke-width="1" opacity="0.12"/>
    <circle cx="0" cy="0" r="160" stroke="#00d2ff" stroke-width="1" stroke-dasharray="6,6" opacity="0.15"/>

    <!-- ========= LETTER 'D' (LEFT / METALLIC CHROME - DIEGO) ========= -->
    <!-- Outer D Bevel Base -->
    <path d="M-155,-160 L-30,-160 C50,-160 95,-105 95,-15 C95,75 50,140 -30,140 L-155,140 Z" 
          fill="url(#chromeDark)" stroke="#000" stroke-width="4"/>
    
    <!-- Outer D Bevel Face (Chrome) -->
    <path d="M-145,-150 L-35,-150 C38,-150 78,-100 78,-15 C78,70 38,130 -35,130 L-145,130 Z" 
          fill="url(#chromeLight)"/>

    <!-- Inner D Cutout Hole -->
    <path d="M-90,-85 L-35,-85 C0,-85 20,-50 20,-15 C20,20 0,65 -35,65 L-90,65 Z" 
          fill="#060c18" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Chrome Highlights on D -->
    <path d="M-145,-150 L-35,-150 C38,-150 78,-100 78,-15" 
          stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M-145,-150 L-145,130" 
          stroke="#ffffff" stroke-width="3" fill="none" opacity="0.7"/>

    <!-- ========= LETTER 'T' (RIGHT & TOP / ELECTRIC BLUE - TIAGO) ========= -->
    <!-- T Main 3D Shape -->
    <!-- Top Bar -->
    <polygon points="-70,-185 160,-185 150,-130 -60,-130" 
             fill="url(#neonCyan)" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="-70,-185 -60,-130 -70,-125 -80,-175" 
             fill="url(#neonCyanLight)"/>
    
    <!-- T Top Highlight -->
    <line x1="-65" y1="-180" x2="155" y2="-180" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>

    <!-- T Vertical Stem (Distinctly Straight, NO 'J' CURVE AT BOTTOM) -->
    <polygon points="-10,-130 50,-130 50,140 -10,140" 
             fill="url(#neonCyan)" stroke="#0284c7" stroke-width="2"/>
    <polygon points="50,-130 65,-120 65,150 50,140" 
             fill="#0369a1"/>
    <polygon points="-10,140 50,140 65,150 0,150" 
             fill="#024e7a"/>
    
    <!-- T Vertical Front Accent Line (Pure Precision) -->
    <line x1="20" y1="-120" x2="20" y2="130" stroke="#7dd3fc" stroke-width="4" filter="url(#cyanGlow)"/>

    <!-- ========= 3D PRINTER EXTRUDER & NOZZLE (RIGHT SIDE) ========= -->
    <g transform="translate(145, -50)">
      <!-- Extruder Mount & Cooling Block -->
      <rect x="-25" y="-70" width="50" height="40" rx="4" fill="url(#chromeLight)" stroke="#000" stroke-width="2"/>
      <!-- Cooling Fins -->
      <line x1="-22" y1="-60" x2="22" y2="-60" stroke="#1e293b" stroke-width="2"/>
      <line x1="-22" y1="-50" x2="22" y2="-50" stroke="#1e293b" stroke-width="2"/>
      <line x1="-22" y1="-40" x2="22" y2="-40" stroke="#1e293b" stroke-width="2"/>

      <!-- Hotend Block -->
      <polygon points="-18,-30 18,-30 14,-10 -14,-10" fill="url(#chromeDark)" stroke="#00d2ff" stroke-width="1.5"/>

      <!-- Precision Brass / Chrome Nozzle -->
      <polygon points="-10,-10 10,-10 0,10" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>

      <!-- Laser / Extrusion Light Beam -->
      <line x1="0" y1="10" x2="0" y2="55" stroke="#00ffff" stroke-width="3" filter="url(#cyanGlow)"/>
      <circle cx="0" cy="55" r="4" fill="#ffffff" filter="url(#cyanGlow)"/>

      <!-- 3D Printed Wireframe Holographic Cube -->
      <g transform="translate(-15, 60)" opacity="0.95">
        <!-- Isometric Cube Faces -->
        <polygon points="15,0 35,12 15,24 -5,12" fill="#0284c7" opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
        <polygon points="-5,12 15,24 15,50 -5,38" fill="#0369a1" opacity="0.6" stroke="#00d2ff" stroke-width="2"/>
        <polygon points="15,24 35,12 35,38 15,50" fill="#075985" opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
        <!-- Cube Internal Lattice Structure -->
        <line x1="15" y1="0" x2="15" y2="24" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
        <circle cx="15" cy="24" r="3" fill="#ffffff" filter="url(#cyanGlow)"/>
      </g>
    </g>

    <!-- DT Micro Badge Tag -->
    <rect x="-45" y="165" width="90" height="24" rx="4" fill="#040b17" stroke="#00d2ff" stroke-width="1.5"/>
    <text x="0" y="182" font-family="'Segoe UI', 'Montserrat', sans-serif" font-weight="900" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="4">D • T</text>
  </g>

  <!-- ================= TYPOGRAPHY (BOTTOM) ================= -->
  <g transform="translate(500, 750)" text-anchor="middle" filter="url(#dropShadow)">
    
    <!-- "2 IRMÃOS" Main Heading -->
    <text x="0" y="0" font-family="'Segoe UI', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="82" letter-spacing="8">
      <tspan fill="url(#chromeLight)" stroke="#000" stroke-width="3">2 IRMÃOS</tspan>
    </text>
    <!-- 2 IRMÃOS White Gloss Highlight -->
    <text x="0" y="0" font-family="'Segoe UI', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="82" letter-spacing="8" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6">
      2 IRMÃOS
    </text>

    <!-- Decorative Electric Divider Line -->
    <g transform="translate(0, 30)">
      <line x1="-380" y1="0" x2="-180" y2="0" stroke="url(#neonCyan)" stroke-width="4" filter="url(#cyanGlow)"/>
      <!-- Glowing Tech Dot -->
      <circle cx="-175" cy="0" r="4" fill="#ffffff" filter="url(#cyanGlow)"/>
      
      <!-- Center Text: "IMPRESSÃO 3D" -->
      <text x="0" y="12" font-family="'Segoe UI', 'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#00e5ff" letter-spacing="14" filter="url(#cyanGlow)">
        IMPRESSÃO 3D
      </text>
      
      <circle cx="175" cy="0" r="4" fill="#ffffff" filter="url(#cyanGlow)"/>
      <line x1="180" y1="0" x2="380" y2="0" stroke="url(#neonCyan)" stroke-width="4" filter="url(#cyanGlow)"/>
    </g>

    <!-- Slogan / Values: CRIATIVIDADE • INOVAÇÃO • REALIZAÇÃO -->
    <text x="0" y="90" font-family="'Segoe UI', 'Montserrat', sans-serif" font-weight="600" font-size="18" fill="#94a3b8" letter-spacing="10">
      CRIATIVIDADE <tspan fill="#00d2ff">•</tspan> INOVAÇÃO <tspan fill="#00d2ff">•</tspan> REALIZAÇÃO
    </text>
  </g>
</svg>

